    <script type="module">
        import { db } from "./firebaseConfig.js";
        import { collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


        const productRef = collection(db, "products")
        const products = document.getElementById("products")

        const divideProductsCategories = (allProducts) => { // take raw products -> divide then into category wise products
            const categories = new Set()
            const prodcutArr = []
            console.log("allProducts", allProducts);
            allProducts.forEach(item => {
                const product = item.data();
                console.log("product", product)
                categories.add(product.category)  //  {"electrnics","mobiles"}
                prodcutArr.push(product) // [product-1, product-2, product-3]

            })



            console.log("categories:", categories);
            const result = [
                // {
                //     category: "",
                //     product: []
                // }
            ]

            for (const category of categories) { // "electronics"
                let products = []
                for (let i = 0; i < prodcutArr.length; i++) {

                    console.log(prodcutArr[i].category);
                    if (prodcutArr[i].category == category) {
                        products.push(prodcutArr[i])
                    }
                }
                result.push({
                    category: category,
                    products: products
                })
            }

            return result;

        }


        const getAllProducts = async () => {
            products.innerHTML = "Loading..."
            try {
                const allProducts = await getDocs(productRef)

                products.innerHTML = null
                console.log("allProducts", allProducts);
                const categorizedProducts = divideProductsCategories(allProducts)
                console.log("categorizedProducts", categorizedProducts);

                // allProducts.forEach(item => {
                //     const product = item.data();
                //     console.log("product", product);

                //     products.innerHTML = products.innerHTML + `

                //     <div class="card col-4 " style="width: 22rem;">
                //         <img src=${product.imageLink} class="card-img-top" alt="..." width="300" height="300">
                //             <div class="card-body">

                //                 <p class="card-text">$${product.price}</p>
                //                 <p class="card-text">${product.description}</p>
                //                 <a href="#" class="btn btn-primary">Go somewhere</a>
                //             </div>
                //     </div>


                //         `
                // });

                categorizedProducts.forEach(item => {
                    console.log("main object", item);

                    const mainDiv = document.createElement("div");
                    const categorydIV = document.createElement("div")
                    const categoryH1 = document.createElement("h1")
                    categoryH1.innerText = item.category;
                    categorydIV.appendChild(categoryH1)
                   
                    // div.classList.add("container mx-auto row p-2 gap-3 ")
                    const productDiv = document.createElement("div");
                    productDiv.classList.add("container", "mx-auto", "row", "p-2", "gap-3")
                    item.products.forEach(item => {
                        const product = item;
                        console.log("product", product);

                        productDiv.innerHTML = productDiv.innerHTML + `
                    
                    <div class="card col-4 " style="width: 22rem;">
                        <img src=${product.imageLink} class="card-img-top" alt="..." width="300" height="300">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">$${product.price}</p>
                                <p class="card-text">${product.description}</p>
                                <a href="#" class="btn btn-primary">Go somewhere</a>
                            </div>
                    </div>
             

                        `
                    });

                    mainDiv.appendChild(categorydIV)
                    mainDiv.appendChild(productDiv)
                    products.appendChild(mainDiv)
                });


            } catch (error) {
                console.error("Error adding product: ", error);
                // alert("Failed to add product. Please try again.");
            }
        }
